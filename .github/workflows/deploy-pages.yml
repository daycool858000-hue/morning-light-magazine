# 正式部署到 GitHub Pages。
# 只能由維護者在 GitHub「Actions」頁面手動執行（workflow_dispatch），推送程式碼不會自動公開網站。
# 僅發布有來源核對及網站發起人明確核准之版本（production 模式）；正式部署仍需手動輸入「確認公開」。
name: 部署到 GitHub Pages（手動）

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '請輸入「確認公開」以部署正式網站'
        required: true

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event.inputs.confirm == '確認公開' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 禁止帶入隔離測試設定
        run: |
          test -z "${LAUNCH_TEST_ONLY:-}" && test -z "${LAUNCH_EXPANSION_QUEUE:-}" && test -z "${QA_EXPANSION_QUEUE:-}"
          test -z "${QA_PENDING_REVIEW_MODE:-}" && test -z "${QA_TOPIC_GUIDES_STAGING:-}"
      - name: 從 62 篇首發原稿製作發布驗收清單（不可當作自行簽核）
        run: |
          node scripts/prepare-launch-article-batch.mjs
          node scripts/prepare-launch-feature-batch.mjs
      - name: 建置正式版
        run: node scripts/build.mjs --mode=production --out=dist-production
      - name: 正式版完整保留門檻（缺篇、缺功能、來源待複核或版本不符就中止，不得覆蓋現有網站）
        run: node scripts/assert-production-ready.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-production

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

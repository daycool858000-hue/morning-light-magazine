# 每次推送與 Pull Request 時：檢查內容格式、建置網站並執行自動化測試。不會部署或公開網站。
name: 檢查與測試

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安裝開發工具（sharp 圖片處理）與測試用瀏覽器（皆不會打包進網站）
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: 建置並測試
        run: npm test
      - name: 使用 WebKit 模擬 Safari 進行手機功能與版面驗收
        run: npm run test:webkit
      - name: 使用 WebKit 模擬 Safari 檢查 QA 測試版新增功能（讀利跳轉、向望索引、城市福利、孕期與生育閱讀區、54主題入口 staging）
        run: npm run test:webkit-qa
      - name: 保存孕期與生育閱讀區 Chromium／WebKit 320／375／390／1280px 截圖（14 天，只供驗收）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-pregnancy-guide-screenshots
          path: test-results/pregnancy-*/
          if-no-files-found: ignore
          retention-days: 14

  calendar:
    # 全站小日曆避讓（QA-only）：Chromium＋WebKit 320／375／390／1280px 逐段捲動檢查，與主要測試並行。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安裝建置工具與測試用瀏覽器（不會打包進網站）
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: 小日曆不遮擋文章、主題頁、官方連結、搜尋結果、讀利、向望、懷孕生育閱讀區與54主題入口 staging
        run: npm run test:calendar
      - name: 保存小日曆避讓截圖（14 天，只供驗收）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-calendar-avoid-screenshots
          path: test-results/calendar-*/
          if-no-files-found: ignore
          retention-days: 14

  full-launch:
    # 完整首發隔離版（dist-qa-all62-city-review，不公開、不部署）：62篇＋54主題＋9活動＋14長期入口＋15縣市入口，以 WebKit 模擬 Safari 驗收。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安裝建置工具與測試用瀏覽器（不會打包進網站）
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: 建置公開 QA 對照組與完整首發隔離版
        run: |
          node scripts/build.mjs --mode=qa --out=dist-qa
          node tests/qa-full-launch-city-services.test.mjs
      - name: WebKit 手機功能：讀利、向望、學習與活動、官方入口、主題捷徑、小日曆、城市福利
        run: node tests/qa-webkit.test.mjs --dist=dist-qa-all62-city-review --queue=docs/QA-FULL-LAUNCH-ALL-62-WITH-CITY-SERVICES-2026-10-18.json
      - name: WebKit 62篇閱讀版面、圖片、noindex 與活動依臺灣日期隱藏
        run: node tests/qa-full-launch-browser.test.mjs --browser=webkit
      - name: WebKit 小日曆不遮擋內容（320／375／390／1280px）
        run: node tests/qa-calendar-avoid.test.mjs --browser=webkit --dist=dist-qa-all62-city-review --shots=test-results/calendar-full-launch-webkit
      - name: 保存完整首發隔離版小日曆截圖（14 天，只供驗收）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-full-launch-calendar-screenshots
          path: test-results/calendar-full-launch-webkit/
          if-no-files-found: ignore
          retention-days: 14

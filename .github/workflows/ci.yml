# 每次推送與 Pull Request 時：檢查內容格式、建置網站並執行自動化測試。不會部署或公開網站。
name: 檢查與測試

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安裝測試用瀏覽器（只用於測試，不會打包進網站）
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: 建置並測試
        run: npm test

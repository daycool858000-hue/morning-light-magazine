# 手動執行，或在開發分支修改本工具時自動執行：連線到官方網頁，把頁面標題與關鍵文字印在執行紀錄，供人工查核比對。
# 不會修改儲存庫、不會建置或部署網站，也不會把任何資料標為「已確認」。
name: 官方來源內容擷取（人工查核輔助）

on:
  # GitHub 只允許從預設分支手動觸發；在開發分支修改本工具時，只自動擷取 FOLLOWUP 清單（群組 urls）
  push:
    branches: [claude/morning-light-visual-v2]
    paths:
      - scripts/verify-sources.mjs
      - .github/workflows/verify-sources.yml
  workflow_dispatch:
    inputs:
      group:
        description: '群組：all、hotlines、resources、counties 或 urls'
        required: true
        default: 'all'
      urls:
        description: '群組為 urls 時要擷取的網址（以空白分隔）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [hotlines, resources, counties, urls]
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && matrix.group == 'urls' || inputs.group == 'all' || inputs.group == matrix.group
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: github.event_name == 'push' && matrix.group == 'urls' || inputs.group == 'all' || inputs.group == matrix.group
        with:
          node-version: 22
      - name: 擷取官方頁面內容
        if: github.event_name == 'push' && matrix.group == 'urls' || inputs.group == 'all' || inputs.group == matrix.group
        env:
          EXTRA_URLS: ${{ inputs.urls }}
        run: |
          set -f
          node scripts/verify-sources.mjs "${{ matrix.group }}" $EXTRA_URLS
